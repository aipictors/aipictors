name = "aipictors"
compatibility_date = "2024-11-11"
main = "./build/worker/index.js"
assets = { directory = "./build/client" }

# Worker 実行時の ctx.env に渡す環境変数（ローカル起動を含む）
[vars]
VITE_GRAPHQL_ENDPOINT = "https://api.aipictors.com/"
VITE_GRAPHQL_ENDPOINT_REMIX = "https://api.aipictors.com/"
AIPICTORS_API_BASE_URL = "https://backend.aipictors.com"

# Server-side secrets/vars for points payment API.
# Set these in the Cloudflare Worker settings for production.
# STRIPE_SECRET_KEY = ""
# AIPICTORS_API_INTERNAL_TOKEN = ""
# AIPICTORS_API_CF_ACCESS_CLIENT_ID = ""
# AIPICTORS_API_CF_ACCESS_CLIENT_SECRET = ""

[observability]
enabled = true

# 作品のタイトル・説明の部分一致検索（app/lib/server/work-text-search.server.ts）
# 中身は aipic サーバーの cron（scripts/search-index/sync-works.sh）で MySQL から同期する
[[d1_databases]]
binding = "SEARCH_DB"
database_name = "aipictors-search"
database_id = "eb97a2cf-7dab-4202-b7c7-a2b87089758d"

# 画像の縮小版（/_w/<幅>/<キー>）を同じドメインから配る（aipictors-cron の image-resize-worker）。
# 別ドメイン（files.aipictors.com）だと、最初の画像を読む前に接続を張り直す時間がかかっていた
[[services]]
binding = "IMAGE_RESIZE"
service = "aipictors-image-resize"

# 一覧ページの HTML を全拠点で共有するキャッシュ（app/lib/edge-page-cache.ts）
[[kv_namespaces]]
binding = "PAGE_CACHE"
id = "8d789ec6fbe94540a435a7936fa2e4bb"
