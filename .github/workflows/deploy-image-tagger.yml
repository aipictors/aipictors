name: Deploy image tagger

on:
  push:
    branches:
      - main
    paths:
      - services/image-tagger/**
      - .github/workflows/deploy-image-tagger.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: Production
    defaults:
      run:
        working-directory: services/image-tagger
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - name: deploy
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee /tmp/wrangler.log || {
            echo "::error::$(tail -c 1800 /tmp/wrangler.log | sed 's/\x1b\[[0-9;]*m//g' | tr '\n' '|')"
            exit 1
          }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
