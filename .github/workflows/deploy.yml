name: Deploy

# main に push したら、すぐにビルドして本番へ出す。
# - 型チェック（遅い）は test.yml で並行して走らせ、デプロイは待たない（型は実行時の JS に影響しない）
# - リントと単体テストはビルドと同時に走らせ、落ちたらデプロイしない（待ち時間は増えない）
# - ドキュメントだけの変更ではデプロイしない
on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/*.md"
      - ".claude/**"
  workflow_dispatch:

# 続けて push されたら古いデプロイは止めて、新しい main だけを出す
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: Production
      url: https://www.aipictors.com
    env:
      VITE_MICRO_CMS_API_KEY: ${{ secrets.VITE_MICRO_CMS_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      # キャッシュは使わない（復元に 10 秒かかり、そのまま入れる方が速い）
      - name: install deps
        run: bun install --ignore-scripts --frozen-lockfile
      - name: 💪 build + 🧪 lint / test (parallel)
        run: |
          set -euo pipefail
          ( bun x oxlint@1.53.0 --config .oxlintrc.json --jsx-a11y-plugin --react-perf-plugin . > /tmp/lint.log 2>&1 \
            && bun test > /tmp/test.log 2>&1 ) &
          checks=$!
          bun remix vite:build
          bun scripts/write-build-version.mjs
          bun wrangler pages functions build --outdir build/worker
          if ! wait "$checks"; then
            echo "::error::リントかテストが落ちたのでデプロイしません"
            cat /tmp/lint.log /tmp/test.log || true
            exit 1
          fi
          tail -n 5 /tmp/test.log
      - name: 🚀 deploy
        run: bun wrangler deploy --name=aipictors
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
