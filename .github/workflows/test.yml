name: Unit Tests & Code Quality

# PR と main への push で 1 回だけ走る（以前は deploy.yml・deps-auto-merge.yml からも呼ばれ、同じテストが 3 回走っていた）
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".claude/**"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_MICRO_CMS_API_KEY: ${{ secrets.VITE_MICRO_CMS_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        run: bun install --ignore-scripts --frozen-lockfile
      - name: Lint
        run: bun x oxlint@1.53.0 --config .oxlintrc.json --jsx-a11y-plugin --react-perf-plugin .
      - name: Run Test
        run: bun test

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        run: bun install --ignore-scripts --frozen-lockfile
      # graphql-env.d.ts は schema.graphql から生成するファイル。手で書き換えていたら落とす
      - name: GraphQL types are up to date
        run: bun x gql-tada generate output && git diff --exit-code app/graphql-env.d.ts
      # tsc の途中結果（tsbuildinfo）を引き継いで、変わったファイルだけ調べる（全体 約 90 秒 → 数秒〜十数秒）
      - name: Restore tsc cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules/.cache/tsc.tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('bun.lock', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ runner.os }}-${{ hashFiles('bun.lock', 'tsconfig.json') }}-
      - name: Typecheck
        run: bun run check
      - name: Save tsc cache
        if: always() && github.ref_name == 'main'
        uses: actions/cache/save@v5
        with:
          path: node_modules/.cache/tsc.tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('bun.lock', 'tsconfig.json') }}-${{ github.sha }}

  # Dependabot の patch 更新だけ、テストと型チェックが通ったら自動でマージする
  dependabot-auto-merge:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    needs: [test, typecheck]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch metadata
        id: prepare
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Auto-merge (patch only)
        if: steps.prepare.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --merge "${{ github.event.pull_request.html_url }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
